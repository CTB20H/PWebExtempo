<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de alumnos y multiplicaciones</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <section class="alumnosContainer">
        <h1>Lista de alumnos</h1>
        <div class="alumnosBtns">
            <button id="btnMostrarLista" class="btn">Mostrar Lista</button>
            <button id="btnLimpiarLista" class="btn">Limpiar Lista</button>
        </div>
        <div id="listaAlumnos" class="hidden">
            <h2 class="subLista">Lista de Alumnos</h2>
            <table class="tblAlumnos">
                <thead>
                    <tr>
                        <th>Matrícula</th>
                        <th>Nombre</th>
                        <th>Calificación</th>
                    </tr>
                </thead>
                <tbody id="tblAlumnosBody">
                </tbody>
            </table>
            <div class="resultados">
                <p><strong>Promedio Grupal:</strong> <span id="promedioGrupal">0.00</span></p>
                <p><strong>Número de Aprobados:</strong> <span id="numAprobados">0</span></p>
                <p><strong>Número de Reprobados:</strong> <span id="numReprobados">0</span></p>
            </div>
        </div>
    </section>
    <section class="calcContainer">
        <h2>Calculadora de Tablas de Multiplicar</h2>
        <p>Selecciona la tabla de multiplicar:</p>
        
        <select id="selectTabla">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
        </select>
    
        <div class="multiBtns">
            <button id="btnCalcular" class="btn">Calcular</button>
            <button id="btnLimpiar" class="btn">Limpiar</button>
        </div>
        <div class="resultadoContainer">
            <h3>Resultado:</h3>
            <div id="Multiplicacion" class="resultadosMulti"></div>
        </div>
    </section>
    <script src="js/alumnos2.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
